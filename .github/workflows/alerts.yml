name: Solar alerts
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alerts
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node alert.mjs
        env:
          SRP_CONFIG: ${{ secrets.SRP_CONFIG }}
      - run: |
          git config user.name srp-bot
          git config user.email srp-bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
